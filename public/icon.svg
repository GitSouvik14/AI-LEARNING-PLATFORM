<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square for Safe-Zone App Icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="100" fill="none" stroke="url(#sparkGrad)" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Neural Net Brain Circuit / Learning Open Book Emblem -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- Base Open Book Base -->
    <path d="M 60 380 Q 256 340 256 420 Q 256 340 452 380 L 452 140 Q 256 100 256 180 Q 256 100 60 140 Z" fill="#1e293b" fill-opacity="0.8" stroke="url(#sparkGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Central Beam / Spine -->
    <line x1="256" y1="180" x2="256" y2="420" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    
    <!-- Neural Synapses & AI Nodes (Left Hemisphere) -->
    <circle cx="140" cy="200" r="16" fill="url(#nodeGrad)" />
    <circle cx="100" cy="280" r="14" fill="#38bdf8" />
    <circle cx="190" cy="290" r="18" fill="#818cf8" />
    <line x1="140" y1="200" x2="100" y2="280" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4" />
    <line x1="140" y1="200" x2="190" y2="290" stroke="#818cf8" stroke-width="5" />
    <line x1="100" y1="280" x2="190" y2="290" stroke="#34d399" stroke-width="4" />
    
    <!-- Neural Synapses & AI Nodes (Right Hemisphere) -->
    <circle cx="372" cy="200" r="16" fill="url(#nodeGrad)" />
    <circle cx="412" cy="280" r="14" fill="#38bdf8" />
    <circle cx="322" cy="290" r="18" fill="#c084fc" />
    <line x1="372" y1="200" x2="412" y2="280" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4" />
    <line x1="372" y1="200" x2="322" y2="290" stroke="#c084fc" stroke-width="5" />
    <line x1="412" y1="280" x2="322" y2="290" stroke="#818cf8" stroke-width="4" />
    
    <!-- Cross Interconnections -->
    <line x1="190" y1="290" x2="256" y2="260" stroke="#38bdf8" stroke-width="5" />
    <line x1="322" y1="290" x2="256" y2="260" stroke="#c084fc" stroke-width="5" />
    <circle cx="256" cy="260" r="12" fill="#f43f5e" />
    
    <!-- Spark of Learning at top center -->
    <polygon points="256,60 268,96 304,108 268,120 256,156 244,120 208,108 244,96" fill="#facc15" />
    <!-- Universal Accessibility Symbol Motif (Stylized human reach) -->
    <circle cx="256" cy="80" r="10" fill="#38bdf8" />
  </g>
  
  <!-- Subtle Accessible Audio / Connectivity Waves -->
  <path d="M 220 440 Q 256 460 292 440" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <path d="M 200 458 Q 256 486 312 458" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.7" />
</svg>
